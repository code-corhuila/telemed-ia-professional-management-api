server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: telemed-ia-professional-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemed_professional_management}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
