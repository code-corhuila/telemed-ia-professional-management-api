spring:
  application:
    name: telemed-ia-professional-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemed_ia}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors answer with the shared envelope; nothing internal reaches the client.
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Numeral 5.3.9: every log line is JSON and carries the request's correlationId.
logging:
  structured:
    format:
      console: ecs
