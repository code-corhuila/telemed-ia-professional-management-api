spring:
  datasource:
    url: jdbc:h2:mem:professional_management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY;INIT=CREATE SCHEMA IF NOT EXISTS professional_management\;CREATE TABLE IF NOT EXISTS professional_management.idempotency_key (key TEXT PRIMARY KEY, created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL, request_hash TEXT, professional_id UUID NOT NULL)
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # H2 has no statement_timeout; the limit is checked on PostgreSQL.
      connection-init-sql: SELECT 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
