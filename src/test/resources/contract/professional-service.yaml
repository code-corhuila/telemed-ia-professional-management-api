openapi: 3.0.3
info:
  title: Professional Service API
  version: 1.0.0
  description: |
    Servicio de gestión de profesionales para TeleMed IA.
    Maneja perfiles de profesionales, especialidades y registro.

servers:
  - url: http://localhost:8080/api/professionals
    description: Local development

tags:
  - name: Professionals
    description: Operaciones sobre profesionales
  - name: Admin
    description: Operaciones administrativas

paths:
  /:
    get:
      summary: Listar profesionales
      tags: [Professionals]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de profesionales
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/PaginatedProfessionalResponse'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /{id}:
    get:
      summary: Obtener profesional por ID
      tags: [Professionals]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdParam'
      responses:
        '200':
          description: Profesional encontrado
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/Professional'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /{id}/status:
    patch:
      summary: Change the profile status (ADMIN only)
      description: |
        Sets the profile status to `ACTIVE` or `INACTIVE` (FR-011, ADR-013, DEC-007).
        Setting the status the profile already has returns `200` and changes nothing,
        so a retry is safe without an `Idempotency-Key`. The Identity & Access account
        and appointment availability are not affected.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdParam'
        - $ref: './_shared.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
      responses:
        '200':
          description: The professional with its current status
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/Professional'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /admin/register:
    post:
      summary: Register a new professional (ADMIN only)
      description: |
        When registering the profile, the system initializes its status as `ACTIVE`
        and its `professionalType` as `GENERAL_PRACTITIONER` (DEC-005: every
        professional is a general practitioner; there is no specialty catalog).
        Neither is sent in this request. The account is created in the identity
        domain, through its API, in the same operation (DEC-003).

        - First request with a new `Idempotency-Key`: `201` with `Location`.
        - Same key and same body: `200` with the same professional; no second
          account or profile is created.
        - Same key with a different body: `422 BUSINESS_RULE_VIOLATION`.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, identityDocument, password, licenseNumber, yearsExperience]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                identityDocument:
                  type: string
                password:
                  type: string
                  minLength: 8
                licenseNumber:
                  type: string
                yearsExperience:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Professional registered with profile status `ACTIVE`
          headers:
            Location:
              description: URI of the registered professional
              schema:
                type: string
                example: /api/v1/professionals/6f178b1a-9c0d-4c23-96ad-1e8da3b2ef6d
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/Professional'
        '200':
          description: Idempotent repetition; returns the professional already registered
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/Professional'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '409':
          description: E-mail, identity document or license number already registered
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './_shared.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: './_shared.yaml#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
