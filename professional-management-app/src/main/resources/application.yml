spring:
  application:
    name: telemed-ia-professional-management-api
  lifecycle:
    # Numeral 5.3.10: graceful shutdown budget.
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemed_ia}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Numeral 5.3.10: pool size.
      maximum-pool-size: 10
      # Maximum wait for a free connection, in milliseconds.
      connection-timeout: 5000
      # Maximum time per statement.
      connection-init-sql: SET statement_timeout = '5s'
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Numeral 5.3.10: maximum time to receive the request headers.
    connection-timeout: 5s
    # Idle keep-alive connections are closed after this time.
    keep-alive-timeout: 60s
  error:
    # Errors answer with the shared envelope; nothing internal reaches the client.
    include-message: never
    include-stacktrace: never
    include-exception: false

# Identity service, reached inside the platform network (DEC-003, identity-and-access-api
# #117 and #122): creates the account of every registered professional.
identity:
  url: ${IDENTITY_URL:http://identity-api:8081}
  client-id: ${SERVICE_CLIENT_ID:professional-management}
  # Delivered privately by the identity owner; without it registrations answer 503.
  client-secret: ${SERVICE_CLIENT_SECRET:}
  request-timeout: ${IDENTITY_REQUEST_TIMEOUT:5s}
  token-refresh-margin: 60s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Numeral 5.3.9: every log line is JSON and carries the request's correlationId.
logging:
  structured:
    format:
      console: ecs
