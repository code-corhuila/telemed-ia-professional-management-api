# Professional Management API service. telemed-ia-infra-postgres includes this file
# in the platform composition root (Anexo G).
# The service declares `expose`, not `ports`: only the API Gateway is
# published to the host (Anexo G, "Solo el gateway se publica al host").
services:
  professional-management-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: telemed-ia/professional-management-api:dev
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      # Public key of the identity service (numeral 5.3.7). The service does not
      # start without it.
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}"
      # Shared PostgreSQL instance (Anexo J), with the domain's application user.
      DB_URL: "jdbc:postgresql://postgres:5432/${PG_DATABASE:-telemed_ia}"
      DB_USERNAME: "${PROFESSIONAL_MANAGEMENT_APP_USER:-professional_management_app}"
      DB_PASSWORD: "${PROFESSIONAL_MANAGEMENT_APP_PASSWORD:?PROFESSIONAL_MANAGEMENT_APP_PASSWORD is required}"
      # Identity service that creates the professionals' accounts (DEC-003): service
      # identity-api, port 8081, reachable only inside the platform network.
      IDENTITY_URL: "${IDENTITY_URL:-http://identity-api:8081}"
      SERVICE_CLIENT_ID: "${PROFESSIONAL_MANAGEMENT_SERVICE_CLIENT_ID:-professional-management}"
      # Delivered privately by the identity owner; lives only in env/<environment>.env.
      # Without it, registrations answer 503.
      SERVICE_CLIENT_SECRET: "${PROFESSIONAL_MANAGEMENT_SERVICE_CLIENT_SECRET:-}"
      # NFR-005: Prometheus scrapes the management port; spans go to the platform collector.
      MANAGEMENT_PORT: "9081"
      OTLP_TRACING_ENDPOINT: "${OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}"
    expose:
      - "8080"
      # Management port (health and metrics), inside the platform network only.
      - "9081"
    networks:
      - platform

networks:
  platform:
    external: true
    name: platform
